services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clearchit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clearchit_local_only}
    ports:
      - "5433:5432"
    volumes:
      - clearchit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearchit"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - clearchit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clearchit
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-clearchit_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-Y2xlYXJjaGl0LWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24tMjAyNg==}
      DDL_AUTO: update
      SHOW_SQL: "false"
    ports:
      - "8081:8081"

volumes:
  clearchit_postgres:
  clearchit_redis:

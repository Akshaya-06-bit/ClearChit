spring.application.name=ClearChit
server.port=${PORT:8081}

# Local defaults; override these environment variables for Docker/cloud deployment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clearchit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Development fallback only. Set JWT_SECRET to a unique Base64-encoded secret in production.
jwt.secret=${JWT_SECRET:Y2xlYXJjaGl0LWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24tMjAyNg==}
jwt.expiration=${JWT_EXPIRATION:3600000}
